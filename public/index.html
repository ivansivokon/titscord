<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #join-screen { display: flex; flex-direction: column; gap: 10px; background: #222; padding: 30px; border-radius: 12px; }
    #join-screen input { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; font-size: 16px; }
    #join-screen button { padding: 10px; border-radius: 8px; border: none; background: #4f46e5; color: white; font-size: 16px; cursor: pointer; }
    #chat-screen { display: none; width: 100%; max-width: 800px; padding: 20px; }
    #controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .ctrl-btn { padding: 12px 16px; border-radius: 8px; border: none; background: #333; color: white; font-size: 18px; cursor: pointer; }
    .ctrl-btn.active { background: #4f46e5; }
    .ctrl-btn.off { background: #b91c1c; }
    #participants { list-style: none; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
    #participants li { background: #2a2a2a; padding: 6px 12px; border-radius: 20px; }
    #videos { display: flex; flex-wrap: wrap; gap: 10px; }
    video { width: 200px; border-radius: 8px; background: #000; transform: scaleX(-1); }
    .screen-video { transform: none; }
  </style>
</head>
<body>
  <div id="join-screen">
    <input id="name-input" placeholder="Ваше имя" maxlength="20" />
    <button id="join-btn">Войти в канал</button>
  </div>

  <div id="chat-screen">
    <div id="controls">
      <button id="mic-btn" class="ctrl-btn active">🎤 Микро</button>
      <button id="deafen-btn" class="ctrl-btn">🔊 Звук</button>
      <button id="camera-btn" class="ctrl-btn">📷 Камера</button>
      <button id="screen-btn" class="ctrl-btn">🖥 Демо</button>
    </div>
    <ul id="participants"></ul>
    <div id="videos"></div>
  </div>

  <script>
    const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/socket`;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    let ws;
    let localUserId;
    let localStream;           // mic + (optionally) camera
    let screenStream;         // screen share
    let peers = new Map();    // remoteId -> RTCPeerConnection
    let isMicOn = true;
    let isDeafened = false;
    let isCameraOn = false;
    let isScreenOn = false;

    // UI elements
    const joinScreen = document.getElementById('join-screen');
    const chatScreen = document.getElementById('chat-screen');
    const nameInput = document.getElementById('name-input');
    const joinBtn = document.getElementById('join-btn');
    const micBtn = document.getElementById('mic-btn');
    const deafenBtn = document.getElementById('deafen-btn');
    const cameraBtn = document.getElementById('camera-btn');
    const screenBtn = document.getElementById('screen-btn');
    const participantsList = document.getElementById('participants');
    const videosDiv = document.getElementById('videos');

    // Join
    joinBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim() || 'Гость';
      joinScreen.style.display = 'none';
      chatScreen.style.display = 'block';

      // get mic stream
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (e) {
        alert('Нет доступа к микрофону');
        localStream = new MediaStream();
      }

      // Connect WebSocket
      ws = new WebSocket(WS_URL);
    ws.onopen = () => {
    console.log('WebSocket opened successfully');
    ws.send(JSON.stringify({ type: 'join', name }));
    };
    ws.onerror = (e) => {
    console.error('WebSocket error:', e);
    alert('Ошибка WebSocket');
    };
    ws.onclose = (e) => {
    console.log('WebSocket closed:', e.code, e.reason);
    alert('Соединение разорвано');
    };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
          case 'users':
            msg.users.forEach(u => addParticipant(u.id, u.name));
            break;
          case 'user-joined':
            addParticipant(msg.id, msg.name);
            // Existing users will initiate offers to the new user
            initiateOfferToNewUser(msg.id);
            break;
          case 'signal':
            handleSignal(msg.sender, msg.data);
            break;
          case 'user-left':
            removeParticipant(msg.id);
            break;
        }
      };
    });

    // ========== Controls ==========
    micBtn.addEventListener('click', () => {
      isMicOn = !isMicOn;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
      }
      micBtn.classList.toggle('off', !isMicOn);
      micBtn.textContent = isMicOn ? '🎤 Микро' : '🔇 Микро';
    });

    deafenBtn.addEventListener('click', () => {
      isDeafened = !isDeafened;
      document.querySelectorAll('audio, video').forEach(el => el.muted = isDeafened);
      deafenBtn.classList.toggle('off', isDeafened);
      deafenBtn.textContent = isDeafened ? '🔇 Откл' : '🔊 Звук';
    });

    cameraBtn.addEventListener('click', async () => {
      if (!isCameraOn) {
        try {
          const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
          const videoTrack = camStream.getVideoTracks()[0];
          if (!localStream) localStream = new MediaStream();
          localStream.addTrack(videoTrack);
          // add track to all peer connections
          peers.forEach(pc => pc.addTrack(videoTrack, localStream));
          isCameraOn = true;
          cameraBtn.classList.add('active');
          cameraBtn.textContent = '📷 Камера';

          // show local preview
          showLocalVideo(videoTrack);
        } catch (e) { alert('Нет доступа к камере'); }
      } else {
        // turn off camera
        if (localStream) {
          localStream.getVideoTracks().forEach(t => {
            t.stop();
            localStream.removeTrack(t);
          });
        }
        peers.forEach(pc => {
          const senders = pc.getSenders();
          senders.forEach(sender => {
            if (sender.track?.kind === 'video' && !sender.track.label.includes('screen')) {
              pc.removeTrack(sender);
            }
          });
        });
        isCameraOn = false;
        cameraBtn.classList.remove('active');
        cameraBtn.textContent = '📷 Камера';
        removeLocalVideo();
      }
    });

    screenBtn.addEventListener('click', async () => {
      if (!isScreenOn) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          const screenTrack = screenStream.getVideoTracks()[0];
          screenTrack.contentHint = 'detail';
          // add to all peers
          peers.forEach(pc => pc.addTrack(screenTrack, screenStream));
          isScreenOn = true;
          screenBtn.classList.add('active');
          screenBtn.textContent = '🖥 Демо';

          // show local screen preview
          const video = document.createElement('video');
          video.srcObject = screenStream;
          video.autoplay = true;
          video.playsInline = true;
          video.classList.add('screen-video');
          video.dataset.screenLocal = true;
          videosDiv.appendChild(video);

          screenTrack.onended = () => {
            // user clicked stop sharing via browser UI
            stopScreenShare();
          };
        } catch (e) { alert('Нет доступа к демонстрации экрана'); }
      } else {
        stopScreenShare();
      }
    });

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
      }
      peers.forEach(pc => {
        const senders = pc.getSenders();
        senders.forEach(sender => {
          if (sender.track?.kind === 'video' && sender.track.label.includes('screen')) {
            pc.removeTrack(sender);
          }
        });
      });
      document.querySelectorAll('[data-screen-local]').forEach(el => el.remove());
      isScreenOn = false;
      screenBtn.classList.remove('active');
      screenBtn.textContent = '🖥 Демо';
    }

    // ========== WebRTC logic ==========
    function initiateOfferToNewUser(remoteId) {
      const pc = createPeerConnection(remoteId);
      // Add all local tracks
      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }
      if (screenStream) {
        screenStream.getTracks().forEach(track => pc.addTrack(track, screenStream));
      }
      createAndSendOffer(pc, remoteId);
    }

    function createPeerConnection(remoteId) {
      const pc = new RTCPeerConnection(config);
      peers.set(remoteId, pc);

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          sendSignal(remoteId, { type: 'candidate', candidate: e.candidate });
        }
      };

      pc.ontrack = (e) => {
        // e.streams[0] is the remote stream
        if (e.track.kind === 'audio') {
          const audio = document.createElement('audio');
          audio.srcObject = e.streams[0];
          audio.autoplay = true;
          audio.muted = isDeafened;
          document.body.appendChild(audio);
        } else if (e.track.kind === 'video') {
          // video could be camera or screen
          const video = document.createElement('video');
          video.srcObject = e.streams[0];
          video.autoplay = true;
          video.playsInline = true;
          if (e.track.label.includes('screen') || e.track.contentHint === 'detail') {
            video.classList.add('screen-video');
          }
          video.dataset.remoteId = remoteId;
          videosDiv.appendChild(video);
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          removePeer(remoteId);
        }
      };

      return pc;
    }

    async function createAndSendOffer(pc, remoteId) {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal(remoteId, { type: 'offer', sdp: pc.localDescription });
      } catch (e) { console.error(e); }
    }

    async function handleSignal(senderId, data) {
      let pc = peers.get(senderId);
      if (!pc && data.type === 'offer') {
        // New incoming connection from existing user to us
        pc = createPeerConnection(senderId);
        if (localStream) {
          localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }
        if (screenStream) {
          screenStream.getTracks().forEach(track => pc.addTrack(track, screenStream));
        }
      }
      if (!pc) return;

      try {
        if (data.type === 'offer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal(senderId, { type: 'answer', sdp: pc.localDescription });
        } else if (data.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === 'candidate') {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      } catch (e) { console.error(e); }
    }

    function sendSignal(targetId, data) {
      if (ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'signal', target: targetId, data }));
      }
    }

    function addParticipant(id, name) {
      const li = document.createElement('li');
      li.id = `p-${id}`;
      li.textContent = name;
      participantsList.appendChild(li);
    }

    function removeParticipant(id) {
      const li = document.getElementById(`p-${id}`);
      if (li) li.remove();
      removePeer(id);
      // Remove associated remote videos
      document.querySelectorAll(`[data-remote-id="${id}"]`).forEach(el => el.remove());
    }

    function removePeer(id) {
      const pc = peers.get(id);
      if (pc) {
        pc.close();
        peers.delete(id);
      }
    }

    function showLocalVideo(track) {
      if (!localStream) return;
      const existing = document.getElementById('local-video');
      if (!existing) {
        const video = document.createElement('video');
        video.id = 'local-video';
        video.srcObject = new MediaStream([track]);
        video.autoplay = true;
        video.playsInline = true;
        video.style.width = '150px';
        videosDiv.prepend(video);
      }
    }

    function removeLocalVideo() {
      const vid = document.getElementById('local-video');
      if (vid) vid.remove();
    }
  </script>
</body>
</html>
